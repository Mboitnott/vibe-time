<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Time — Control</title>
<style>
  :root {
    --bg: #111317;
    --panel: #1b1e24;
    --line: #2c3038;
    --fg: #e9ecf1;
    --muted: #8a919e;
    --ok: #3ddc84;
    --warn: #ffc93c;
    --over: #ff4b4b;
    --clock: #7fc8ff;
    --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .04em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 12px; }

  button {
    font: inherit; font-weight: 600; color: var(--fg);
    background: #2a2f38; border: 1px solid #3a404b; border-radius: 8px;
    padding: 10px 14px; cursor: pointer;
  }
  button:hover { background: #343a45; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.go { background: #1f7a4a; border-color: #2a9a5e; }
  button.stop { background: #8a2a2a; border-color: #a83a3a; }
  button.on { background: var(--clock); border-color: var(--clock); color: #000; }

  #preview {
    background: #000; border-radius: 10px; padding: 18px 12px; text-align: center;
  }
  #pvLabel { font-size: 12px; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); }
  #pvTime {
    font-size: clamp(48px, 14vw, 96px); font-weight: 700; line-height: 1.1;
    font-variant-numeric: tabular-nums; color: var(--ok);
  }
  #pvTime.warn { color: var(--warn); }
  #pvTime.over { color: var(--over); }
  #pvTime.clock { color: var(--clock); }
  #pvMsg { color: var(--warn); font-weight: 600; min-height: 1.2em; white-space: pre-wrap; word-wrap: break-word; }
  #pvStatus { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; }
  .nudge { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .nudge button { font-size: 20px; padding: 14px 0; }
  .transport { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 8px; }
  .transport button { font-size: 18px; padding: 14px 0; }

  .dur { display: flex; gap: 6px; align-items: center; }
  .dur input {
    width: 64px; font: inherit; font-size: 22px; text-align: center;
    background: #0d0f12; color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 4px;
    font-variant-numeric: tabular-nums;
  }
  .dur span { color: var(--muted); font-size: 20px; }
  .dur small { display: block; text-align: center; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .presets button { padding: 6px 10px; font-size: 13px; }

  textarea {
    width: 100%; min-height: 80px; resize: vertical;
    font: inherit; font-size: 16px; color: var(--fg);
    background: #0d0f12; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
  }
  label.check { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
  .keys { font-size: 12px; color: var(--muted); line-height: 1.6; }
  kbd { background: #2a2f38; border: 1px solid #3a404b; border-radius: 4px; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>VIBE TIME</h1>
    <div class="row">
      <button id="clockBtn">Show Current Time</button>
      <button id="openBtn" class="primary">Open Display</button>
    </div>
  </header>

  <section class="panel">
    <div id="preview">
      <div id="pvLabel">Countdown</div>
      <div id="pvTime">00:00</div>
      <div id="pvMsg"></div>
    </div>
    <div id="pvStatus">Display not open</div>

    <div class="nudge">
      <button data-nudge="-5">−5</button>
      <button data-nudge="-1">−1</button>
      <button data-nudge="1">+1</button>
      <button data-nudge="5">+5</button>
    </div>
    <div class="transport">
      <button id="startBtn" class="go">Start</button>
      <button id="resetBtn">Reset</button>
    </div>
  </section>

  <section class="panel">
    <h2>Countdown</h2>
    <div class="row">
      <div class="dur">
        <div><input id="inH" type="number" min="0" max="99" value="0"><small>hr</small></div><span>:</span>
        <div><input id="inM" type="number" min="0" max="59" value="10"><small>min</small></div><span>:</span>
        <div><input id="inS" type="number" min="0" max="59" value="0"><small>sec</small></div>
      </div>
      <div class="grow"></div>
      <button id="setBtn" class="primary">Set</button>
    </div>
    <div class="presets">
      <button data-preset="1">1m</button>
      <button data-preset="5">5m</button>
      <button data-preset="10">10m</button>
      <button data-preset="15">15m</button>
      <button data-preset="20">20m</button>
      <button data-preset="30">30m</button>
      <button data-preset="45">45m</button>
      <button data-preset="60">60m</button>
    </div>
  </section>

  <section class="panel">
    <h2>Message to Display</h2>
    <textarea id="msgIn" placeholder="e.g. WRAP IT UP · 2 MIN TO BREAK · LOOK AT CAMERA 2"></textarea>
    <div class="row" style="margin-top:10px">
      <label class="check"><input id="flashIn" type="checkbox"> Flash</label>
      <div class="grow"></div>
      <button id="clearMsgBtn">Clear</button>
      <button id="sendMsgBtn" class="primary">Send</button>
    </div>
  </section>

  <div class="keys">
    <kbd>Space</kbd> start/pause · <kbd>R</kbd> reset · <kbd>C</kbd> toggle clock ·
    <kbd>←</kbd>/<kbd>→</kbd> −1/+1 min · <kbd>⇧</kbd>+<kbd>←</kbd>/<kbd>→</kbd> −5/+5 min ·
    <kbd>⌘/Ctrl</kbd>+<kbd>Enter</kbd> send message
  </div>
</main>

<script>
const KEY = 'prod-timer-state';
const WARN_MS = 60 * 1000;

// endAt is used while running, remaining while paused; display derives time from these
// so it stays accurate even between broadcasts.
const state = {
  mode: 'countdown',
  running: false,
  duration: 10 * 60 * 1000,
  remaining: 10 * 60 * 1000,
  endAt: 0,
  message: '',
  flash: false,
};

try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved) Object.assign(state, saved);
} catch {}

let displayWin = null;
let bc = null;
try {
  bc = new BroadcastChannel('prod-timer');
  bc.onmessage = e => { if (e.data && e.data.type === 'hello') broadcast(); };
} catch {}
window.addEventListener('message', e => {
  if (e.data && e.data.type === 'hello') broadcast();
});

function broadcast() {
  const msg = { type: 'state', state: { ...state } };
  try { if (displayWin && !displayWin.closed) displayWin.postMessage(msg, '*'); } catch {}
  try { bc && bc.postMessage(msg); } catch {}
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
}

function remaining() {
  return state.running ? state.endAt - Date.now() : state.remaining;
}

function setRemaining(ms) {
  if (state.running) state.endAt = Date.now() + ms;
  else state.remaining = ms;
}

// ---- actions ----
function start() {
  if (state.running) return;
  state.endAt = Date.now() + state.remaining;
  state.running = true;
  broadcast();
}
function pause() {
  if (!state.running) return;
  state.remaining = state.endAt - Date.now();
  state.running = false;
  broadcast();
}
function toggleRun() { state.running ? pause() : start(); }
function reset() {
  state.running = false;
  state.remaining = state.duration;
  broadcast();
}
function setDuration(ms) {
  state.duration = ms;
  state.running = false;
  state.remaining = ms;
  syncInputs();
  broadcast();
}
function nudge(min) {
  setRemaining(remaining() + min * 60 * 1000);
  broadcast();
}
function toggleClock() {
  state.mode = state.mode === 'clock' ? 'countdown' : 'clock';
  broadcast();
}
function sendMessage() {
  state.message = $msgIn.value;
  state.flash = $flashIn.checked;
  broadcast();
}
function clearMessage() {
  state.message = '';
  state.flash = false;
  $msgIn.value = '';
  $flashIn.checked = false;
  broadcast();
}
function openDisplay() {
  if (displayWin && !displayWin.closed) { displayWin.focus(); return; }
  displayWin = window.open('display.html', 'prod-timer-display', 'width=1280,height=720');
  setTimeout(broadcast, 300);
}

// ---- wiring ----
const $ = id => document.getElementById(id);
const $inH = $('inH'), $inM = $('inM'), $inS = $('inS');
const $msgIn = $('msgIn'), $flashIn = $('flashIn');

function syncInputs() {
  const t = Math.round(state.duration / 1000);
  $inH.value = Math.floor(t / 3600);
  $inM.value = Math.floor((t % 3600) / 60);
  $inS.value = t % 60;
}
syncInputs();
$msgIn.value = state.message;
$flashIn.checked = state.flash;

$('setBtn').onclick = () => {
  const n = el => Math.max(0, parseInt(el.value, 10) || 0);
  setDuration(((n($inH) * 60 + n($inM)) * 60 + n($inS)) * 1000);
};
[$inH, $inM, $inS].forEach(el => el.addEventListener('keydown', e => {
  if (e.key === 'Enter') $('setBtn').click();
}));
document.querySelectorAll('[data-preset]').forEach(b =>
  b.onclick = () => setDuration(+b.dataset.preset * 60 * 1000));
document.querySelectorAll('[data-nudge]').forEach(b =>
  b.onclick = () => nudge(+b.dataset.nudge));
$('startBtn').onclick = toggleRun;
$('resetBtn').onclick = reset;
$('clockBtn').onclick = toggleClock;
$('openBtn').onclick = openDisplay;
$('sendMsgBtn').onclick = sendMessage;
$('clearMsgBtn').onclick = clearMessage;
$msgIn.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendMessage(); }
});

document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const step = e.shiftKey ? 5 : 1;
  switch (e.key) {
    case ' ': e.preventDefault(); toggleRun(); break;
    case 'r': case 'R': reset(); break;
    case 'c': case 'C': toggleClock(); break;
    case 'ArrowRight': e.preventDefault(); nudge(step); break;
    case 'ArrowLeft': e.preventDefault(); nudge(-step); break;
  }
});

// ---- preview ----
function fmtCountdown(ms) {
  const over = ms < 0;
  const total = over ? Math.floor(-ms / 1000) : Math.ceil(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const pad = n => String(n).padStart(2, '0');
  return (over ? '+' : '') + (h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`);
}
function fmtClock(d) {
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  const pad = n => String(n).padStart(2, '0');
  return `${h}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${ampm}`;
}

const $pvTime = $('pvTime'), $pvLabel = $('pvLabel'), $pvMsg = $('pvMsg'), $pvStatus = $('pvStatus');
const $startBtn = $('startBtn'), $clockBtn = $('clockBtn');

function render() {
  const ms = remaining();
  if (state.mode === 'clock') {
    $pvLabel.textContent = 'Current Time (countdown still running underneath)';
    $pvTime.textContent = fmtClock(new Date());
    $pvTime.className = 'clock';
  } else {
    $pvLabel.textContent = ms < 0 ? 'Over Time' : (state.running ? 'Countdown' : 'Paused');
    $pvTime.textContent = fmtCountdown(ms);
    $pvTime.className = ms < 0 ? 'over' : ms <= WARN_MS ? 'warn' : '';
  }
  $pvMsg.textContent = state.message.trim();

  $startBtn.textContent = state.running ? 'Pause' : 'Start';
  $startBtn.className = state.running ? 'stop' : 'go';
  $clockBtn.textContent = state.mode === 'clock' ? 'Back to Countdown' : 'Show Current Time';
  $clockBtn.classList.toggle('on', state.mode === 'clock');

  const open = displayWin && !displayWin.closed;
  $pvStatus.textContent = open ? 'Display open · drag it to the confidence monitor and click it for fullscreen'
                               : 'Display window not opened from here (click Open Display)';
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Heartbeat so a reloaded or late-opened display always catches up.
setInterval(broadcast, 1000);

// Try to open the display right away; popup blockers may require the button instead.
openDisplay();
</script>
</body>
</html>
